<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monster Group TierApp</title>
  <style>
    :root {
      --tier-5-5: #ff3b30; 
      --tier-5-4: #ff9500; 
      --tier-5-3: #ffcc00; 
      --tier-5-2: #11a84e; 
      --tier-5-1: #007aff; 

      --tier-10-10: #ff3b30;
      --tier-10-9: #ff9500;
      --tier-10-8: #ffcc00;
      --tier-10-7: #11a84e;
      --tier-10-6: #007aff;
      --tier-10-5: #3d499f; 
      --tier-10-4: #5b21b6; 
      --tier-10-3: #a86422; 
      --tier-10-2: #2c2c2e; 
      --tier-10-1: #ffffff;

      --bg-dark: #121212;
      --surface: #1c1c1e; 
      --accent: #30d158;
      --danger: #ff453a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark); color: #fff; margin: 0; padding: 10px;
      display: flex; flex-direction: column; align-items: center;
      padding-bottom: 150px;
      user-select: none; -webkit-user-select: none;
    }

    h1 { margin-bottom: 2px; font-size: 18px; text-transform: uppercase; text-align: center; color: #fff; }
    p.subtitle { color: #8e8e93; margin-top: 0; margin-bottom: 10px; font-size: 11px; text-align: center; }
    .room-bar {
      background: var(--surface); padding: 8px; border-radius: 8px; width: 100%;
      max-width: 800px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px;
      border: 1px solid #3a3a3c; box-sizing: border-box; color: #fff;
    }
    .room-bar-row {
      display: flex; gap: 6px; align-items: center; justify-content: space-between; width: 100%;
    }
    .room-bar label { color: #8e8e93; font-size: 12px; font-weight: bold; width: 50px; flex-shrink: 0; }
    .room-bar input {
      background: #2c2c2e; color: #fff; border: 1px solid #444; padding: 6px 8px;
      border-radius: 6px; font-size: 13px; flex: 1; outline: none;
    }
    .room-bar button {
      background: var(--accent); color: #000; border: none; padding: 6px 12px;
      border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; flex: 1;
    }
    .room-bar button.leave-btn {
      background: var(--danger); color: #fff; flex: 1;
    }
